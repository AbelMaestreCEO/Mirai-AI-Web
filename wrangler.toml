name = "mirai-ai-web"
main = "workers/worker.ts"
compatibility_date = "2024-01-01"
# El binding send_email se expone como stub RPC: sin este flag, env.EMAIL.send
# ni siquiera existe (wrangler avisa: "Tried to access method 'send' on a
# Service Binding... enable the 'rpc' compat flag"). Se activa el flag suelto en
# vez de mover compatibility_date para no arrastrar dos años de cambios de
# runtime en el resto del Worker. Habilita EMAIL y las llamadas RPC al binding
# MIRAI (ver más abajo). No hay Durable Objects.
compatibility_flags = [ "rpc" ]

# Configuración de Assets Estáticos (Frontend)
# Sirve los archivos de 'public/': iconos, manifest, sw.js y la app compilada
# en public/app/. El binding ASSETS lo usa el Worker para devolver
# /app/index.html en las rutas de la app (/chat, /login...; ver
# workers/worker.ts).
assets = { directory = "./public", binding = "ASSETS" }

# --- BUILD DEL FRONTEND (Quasar, carpeta frontend/) ---
# Compila la app a public/app/ antes de cada `wrangler deploy` (también en
# Workers Builds) y de `wrangler dev`. public/app/ no se sube a git.
[build]
command = "node scripts/build-frontend.mjs"
watch_dir = "frontend/src"

# --- BINDING DE BASE DE DATOS D1 ---
# Nombre del binding en tu código: DB
# El nombre del dataset en Cloudflare debe coincidir con 'database_name'
[[d1_databases]]
binding = "MIRAI_AI_DB"
database_name = "mirai-ai-db"
database_id = "0609f674-fdd9-4320-9a85-0b416ec68282"

# --- BINDING DE ALMACENAMIENTO R2 ---
# Nombre del binding en tu código: ASSETS
# El nombre del bucket en Cloudflare debe coincidir con 'bucket_name'
[[r2_buckets]]
binding = "MIRAI_AI_ASSETS"
bucket_name = "mirai-ai-assets"

[[r2_buckets]]
binding = 'MIRAI_PHOTOS'
bucket_name = 'mirai-photos'

# --- CONFIGURACIÓN DE DOMINIO (Opcional pero recomendado) ---
# Si quieres que el Worker responda directamente en aberumirai.com
# (Asegúrate de tener el dominio verificado en Cloudflare)
# routes = [
#   { pattern = "aberumirai.com/*", zone_name = "aberumirai.com" }
# ]

# --- OPCIONAL: Reglas de envío de logs o métricas ---
# observability = { enabled = true }

[ai]
binding = "AI"

# --- ENVÍO DE CORREO (Cloudflare Email Sending) ---
# El dominio remitente ya está onboarded; para reprovisionarlo:
#   npx wrangler email sending enable aberumirai.com
# allowed_sender_addresses limita el binding a esa única dirección.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = [ "mirai@aberumirai.com" ]

# --- MIRAI: EL PERSONAJE ---
# Quién es Mirai y cómo se porta lo presta Mirai Assistant, el mismo texto que
# usan el chat interno, el Mirai Launcher y la atención por WhatsApp. Así una
# corrección de Mirai hecha allí llega aquí sin volver a desplegar este Worker.
# Solo trae texto: el modelo, la clave y las cuotas siguen siendo los de aquí.
# Ver getMiraiPersona en workers/lib/persona.ts.
#
# mirai-assistant tiene que estar desplegado ANTES, o este despliegue fallará
# al no encontrar el servicio.
[[services]]
binding = "MIRAI"
service = "mirai-assistant"
entrypoint = "PersonajeRPC"

[vars]
VAPID_PUBLIC_KEY = "BAgXM-Oiko7pyU-1nXGvuq5MQhtH_ms27367O08dfcUA8eG3ba-ykgoidpfyI6D2KOZO6vr0hzV3a9D0fGsZLTQ" # tu clave actual
ENVIRONMENT = "production"

[[kv_namespaces]]
binding = "KV_RATE"
id = "47c1023e992845449851b4572dcf37e7"

[triggers]
# "0 * * * *"  -> limpieza horaria de /format/ en R2
# "*/2 * * * *" -> red de seguridad: revisa/finaliza jobs de vídeo avatar
#                  pendientes en Pruna aunque el cliente haya dejado de hacer polling
crons = ["0 * * * *", "*/2 * * * *"]